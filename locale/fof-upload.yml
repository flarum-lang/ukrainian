fof-upload:
  admin:
    help_texts:
      client_extension: "За замовчуванням під час завантаження буде обрано безпечне розширення файлу на основі типу MIME.\nДля деяких типів файлів, заснованих на ZIP або двійкових даних, це може призвести до того, що замість очікуваного розширення буде використано загальне розширення.\nТут ви можете ввести через кому список розширень файлів, який буде збережено дослівно.\n"
      composer_buttons: "За замовчуванням відображаються і кнопка медіа-менеджера, і кнопка завантаження. Ви також можете обрати відображення лише однієї кнопки.\n"
      custom_s3_url: "Публічна базова URL-адреса, з якої надаються файли: CDN або власний домен перед бакетом.\nЗалиште поле порожнім, щоб використовувати типову URL-адресу провайдера. Адреса має містити <code>https://</code>.\n"
      disable-download-logging: "Відключити реєстрацію кожного завантаження, зробленого користувачами вашого форуму. Увімкнення цієї опції дозволяє переглядати кількість скпчувань та інші показники в найближчому майбутньому.\n"
      disable-hotlink-protection: "Захист від гарячих посилань запобігає відкриттю скачувань з інших сайтів. Поточний метод вимагає токен csrf та ідентифікатор публікації.\n"
      download_templates: "Шаблони скачування - це те, як скачування відображаються на вашому форумі, наприклад, попередній перегляд, кнопки. Наразі доступні:\n"
      local_cdn: "Необов’язково. Якщо <code>assets/files</code> обслуговується через CDN, укажіть його базову URL-адресу: посилання на завантажені файли використовуватимуть її.\nЗалиште поле порожнім, щоб надавати файли безпосередньо з форуму.\n"
      mime_order: "Правила перевіряються згори вниз до першого збігу, тому розміщуйте конкретніші правила перед загальними.\n"
      mime_types: "Визначте, які файли учасники можуть завантажувати, де зберігається кожен тип і як він відображається в дописах.\n"
      resize: "Оберіть, чи потрібно змінювати розмір зображень перед завантаженням. Ви можете вибрати максимальну ширину і висоту в пікселях. Процес зміни розміру зберігає співвідношення сторін зображень.\n"
      s3_acl: "Застосовується до кожного завантаженого об’єкта. Залиште поле порожнім, щоб використовувати типове значення провайдера (зазвичай private).\nВикористовуйте <code>public-read</code>, якщо файли мають бути доступні для читання безпосередньо з бакета.\n"
      s3_acl_unsupported: "Провайдер {provider} не підтримує ACL. Керуйте публічним доступом у його власній панелі.\n"
      s3_compatible_storage: "Наступні налаштування потрібні лише у разі використання сховища, сумісного з S3. Якщо ви використовуєте AWS, ви можете залишити їх порожніми.\n"
      s3_endpoint: "URL-адреса API S3 провайдера, а не публічна URL-адреса бакета. Для Amazon S3 вона не потрібна.\n"
      s3_instance_profile: "Залиште ключ і секрет порожніми, щоб використовувати облікові дані в профілі екземпляра.\n"
      s3_path_style: "Додає бакет до шляху URL-адреси замість імені хоста. Потрібно для MinIO та Cloudflare R2; задається автоматично після вибору провайдера.\n"
      s3_provider: "Вибір провайдера задає формат кінцевої точки, стиль адресації й підтримку ACL нижче. Якщо провайдера немає в списку, виберіть інший S3-сумісний сервіс.\n"
      storage_configure_another: "Інші сервіси сховища встановлено, але ще не налаштовано. Налаштування сервісу не змінює місце зберігання, доки ви не призначите його типу файлів.\n"
      storage_intro: "Тут показуються налаштовані сервіси або ті, які використовує певний тип файлів. Можна налаштувати сервіс заздалегідь, а потім призначити його типу файлів на вкладці файлів.\n"
      storage_not_installed: 'Потрібні Amazon S3, Cloudflare R2 або Qiniu? Вони потребують додаткового пакета — див. <a>встановлення адаптерів сховища</a>.'
      thumbnail_quality: "Якість кодування від 1 до 100 для мініатюр WebP і JPEG. Вищі значення дають чіткіші зображення, але більші файли. Мініатюри GIF і PNG зберігаються без втрат та ігнорують цей параметр. Наявні мініатюри зберігають поточну якість до повторного створення командою для обробки старих файлів.\n"
      thumbnails: "Створювати зменшені мініатюри зображень під час завантаження. Мініатюра показується в дописі; натискання відкриває оригінал у повній роздільності в новій вкладці. Мініатюри суттєво зменшують трафік і обсяг сторінок на форумах із багатьма великими зображеннями.\n"
      watermark: "Оберіть, чи буде додано водяний знак до зображень під час завантаження. Водяні знаки додаються до зображень, які не є гіфками, відповідно до ваших налаштувань нижче.\n"
    inspect-mime:
      description: "FoF Upload використовує бібліотеку <a>PHP Mime Detector</a> для загальних типів MIME і PHP Fileinfo як запасний варіант.\nЗначення MIME, яке повертає Fileinfo, може відрізнятися від сервера до сервера!\n"
