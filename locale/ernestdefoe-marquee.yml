ernestdefoe-marquee:
  admin:
    backdrop_color_help: 'Використовується для всіх карток без фонового зображення. Залиште порожнім, щоб використовувати колір банера форуму, як у вітальному банері.'
    backdrop_color_label: 'Колір картки без фонового зображення'
    backdrop_tag_color_help: 'Працює як заголовок обговорення у Flarum. Якщо теги обговорення не мають кольору, використовується колір банера.'
    backdrop_tag_color_label: 'Використовувати колір тега обговорення, якщо колір картки не задано'
    deepl_help: 'Якщо для гри є стаття у Вікіпедії вибраною мовою, її опис береться звідти. Решта даних IGDB про ігри й більшість описів книжок із Open Library надходять англійською. За наявності ключа DeepL Marquee перекладає описи ігор і книжок, а також теми книжок вибраною мовою один раз для кожного твору й зберігає переклад. Жанри й режими ігор перекладаються мовними файлами форуму. <a>Отримайте безплатний ключ API DeepL</a>. Безплатний тариф дозволяє перекладати 500 000 символів на місяць, чого вистачає на тисячі творів. Ключ зберігається на сервері.'
    deepl_label: 'Ключ API DeepL (необов’язково)'
    dock_help: 'Кругла кнопка в нижньому куті обговорення з карткою відкриває меню кожного твору. Через нього можна повернутися до відомостей і скористатися діями інших розширень, зокрема колекцією, списком бажань і переліком власників Curio.'
    dock_icon_help: 'Піктограма Font Awesome на кнопці замість обкладинки, наприклад fas fa-film або fas fa-bars (назви наведено на fontawesome.com). Залиште порожнім для показу обкладинки.'
    dock_icon_label: 'Піктограма кнопки меню'
    dock_label: 'Показувати меню творів після прокручування картки'
    game_backdrop_help: 'IGDB має широкі ілюстрації для більшості ігор. Для решти картка може використовувати найбільший знімок екрана, якщо його роздільної здатності достатньо. Усі, хто може змінити прив’язаний твір обговорення, можуть також вибрати або завантажити власне тло.'
    game_backdrop_label: 'Тло картки гри'
    game_backdrop_options:
      artwork: 'Лише ілюстрація'
      artwork_screenshot: 'Ілюстрація або знімок екрана, якщо ілюстрації немає'
      none: 'Без фонового зображення'
    igdb_client_id: 'Ідентифікатор клієнта'
    igdb_client_secret: 'Секрет клієнта'
    igdb_help: 'Дані про ігри надходять із IGDB, якою керує Twitch. <a>Зареєструйте застосунок у консолі розробника Twitch</a> (спочатку Twitch вимагатиме двофакторну автентифікацію для облікового запису, тип клієнта — Confidential, URL переспрямування — https://localhost), створіть секрет клієнта і вставте обидва значення сюди. Секрет зберігається на сервері. IGDB безплатна для некомерційних форумів, а для комерційних потрібна угода з IGDB.'
    igdb_label: 'Облікові дані застосунку Twitch для IGDB'
    language_help: 'Мова назв, описів і жанрів фільмів та серіалів, задана кодом, наприклад fr, fr-FR або pt-BR. Залиште порожнім, щоб використовувати типову мову форуму. Дані про ігри в IGDB англійською (вона має лише японські й корейські назви), тому опис гри береться з Вікіпедії цією мовою, якщо там є відповідна стаття. Решта перекладається, якщо додати ключ DeepL. Дані про альбоми надходять від виконавців. Назви, обкладинки й видавництва книжок відповідають вибраній мові, якщо Open Library має відповідне видання. Описи книжок здебільшого англійською. Для вже прив’язаних творів мова зміниться під час наступного оновлення.'
    language_label: 'Мова даних'
    language_placeholder: 'Мова форуму'
    list_meta_help: 'Відомості відображаються поруч із рядком автора. Номер сезону або код епізоду (Season 2, S03E03) показується для обох перших варіантів.'
    list_meta_kind_year: 'Тип і рік (гра · 2026)'
    list_meta_label: 'Що показувати під пов’язаним обговоренням у списку'
    list_meta_none: Нічого
    list_meta_year: 'Лише рік (2026)'
    list_posters_help: 'Малий постер біля кожного пов’язаного обговорення. Вимкніть, якщо мініатюри вже показує інше розширення, наприклад FoF Discussion Thumbnail.'
    list_posters_label: 'Показувати постери в списку обговорень'
    permissions:
      link_any: 'Змінювати прив’язаний твір у будь-якому обговоренні'
      link_own: 'Змінювати прив’язаний твір у власних обговореннях'
    show_scores_help: 'Оцінки користувачів TMDB, критиків і учасників IGDB та читачів Open Library на картці, у сезонах і випусках.'
    show_scores_label: 'Показувати бали й оцінки на картці'
    show_source_link_help: 'Кнопка під карткою відкриває твір у джерелі. Коротке посилання на джерело («Дані про гру з IGDB.com», примітка TMDB) відображається завжди. TMDB вимагає своєї примітки, а умови IGDB передбачають зазначення джерела.'
    show_source_link_label: 'Показувати кнопку «Переглянути на TMDB / IGDB…»'
    source_book: 'Книжки (Open Library, без ключа)'
    source_game: 'Ігри (IGDB)'
    source_movie: 'Фільми (TMDB)'
    source_music: 'Музичні альбоми (Deezer, без ключа)'
    source_none: 'Звичайне обговорення'
    source_tv: 'Серіали (TMDB)'
    tags_help: 'Коли учасник починає обговорення в одному з цих тегів, поле заголовка шукає в його джерелі, а в заголовку обговорення відображається картка твору. Решта тегів використовує звичайний редактор обговорень.'
    tags_label: 'Джерела за тегами'
    title_year_help: 'Заголовки обговорень і картка матимуть вигляд «Final Fantasy VII Remake (2020)». Вимкніть, щоб лишити «Final Fantasy VII Remake». Дата на картці все одно відображатиметься. Налаштування діє для творів, прив’язаних після зміни. Наявні заголовки зберігають рік до перейменування.'
    title_year_label: 'Додавати рік до назв'
    tmdb_token_help: 'Дані про фільми й серіали надходять із The Movie Database. <a>Отримайте токен у налаштуваннях API TMDB</a> та вставте сюди довгий токен API Read Access Token. Він зберігається на сервері.'
