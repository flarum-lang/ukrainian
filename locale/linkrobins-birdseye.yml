      geoip_auto_download_label: 'Автоматично завантажувати базу даних країн'
      geoip_db_path_help: 'Залиште поле порожнім, щоб використовувати автоматичне завантаження. Щоб використовувати власну базу у форматі MaxMind, укажіть повний шлях до неї на цьому сервері. Наприклад, завантажте безплатну GeoLite2-Country.mmdb із maxmind.com зі свого облікового запису й розпакуйте файл .mmdb з архіву .tar.gz. Приклад шляху — /home/you/geoip/GeoLite2-Country.mmdb. Зберігайте файл за межами публічної теки сайту (public_html або подібної), щоб його не можна було завантажити через сайт. Переконайтеся, що PHP може його читати. База використовується, лише якщо довірений заголовок проксі не містить країни. Усі пошуки виконуються на цьому сервері.'
      geoip_db_path_label: 'Файл бази даних країн (необов’язково)'
      weekly_digest_help: 'Щопонеділка надсилає адміністраторам підсумок попереднього тижня. Він містить кількість відвідувачів, переглядів, дописів і реєстрацій, а також найпопулярніші обговорення й пошуковий запит. Лист надсилає пошта форуму. Дані не передаються іншому сервісу аналітики.'
