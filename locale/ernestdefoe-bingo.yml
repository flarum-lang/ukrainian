    templates:
      awards:
        name: 'Бінго з церемонією нагородження'
        squares: "Промову перериває музика\nПереможець забуває комусь подякувати\n«Я нічого не підготував»\nПолітичний жарт\nХтось спотикається на сходах\nНесподіваний виступ\nВедучий змінює костюм\nЖарт двох ведучих не смішить\nОвації стоячи\nКамера показує зіркову пару\nХтось дякує мамі\nПереможець плаче\nНічия\nПереплутали конверти\nРозділ пам’яті померлих\nПереможець читає з телефона\nЗапікане слово\nХтось приводить дитину\nЕпізод із доставкою піци або їжі\nМузичний номер про номінантів\nШоу затягується\nНагорода за фільм-продовження\nПереможця немає в залі\n«Це для всіх, хто дивиться вдома»\nЕфектна сукня або костюм\nКамера показує, як хтось заснув у залі\nВедучий кепкує з відомого гостя\nПомилка в телесуфлері\nСелфі на сцені\nДовгий шлях до сцени\n"
      football:
        name: 'Бінго з трансляцією матчу'
        squares: "Втрата м’яча\nПерехоплення\nТачдаун після перехоплення\nФілд-гол із понад 50 ярдів\nНевдалий удар на додатковий бал\nДвоочкова реалізація\nТренер оскаржує рішення\nРішення скасовано після перегляду\nПрапорець під час важливого розіграшу\nГруба гра проти гравця, який пасує\nПерешкоджання прийому пасу\nЗатримка суперника\nФальстарт\nКороткий початковий удар\nСейфті\nУспішна четверта спроба\nСек на третій спробі\nХитрий розіграш\nЗаблокований удар\nТачдаун після повернення початкового удару\nГравець губить шолом\nУболівальники пускають хвилю\nТренер кричить на суддю\nЗнаменитість на трибуні\n«Ось за що йому стільки платять»\nКоментатори згадують матір гравця\nПауза через травму\nGatorade на полі\nКоманда відхиляє штраф\nСпроба пасу «Гейл Мері»\n"
      keynote:
        name: 'Бінго з презентацією'
        squares: "«І ще одна річ»\n«Думаємо, вам сподобається»\nДемонстрація йде не за планом\n«Доступно відсьогодні»\nНовий колір\n«Найкраще, що ми створювали»\nОвації стоячи\nВідео з клієнтом\nДіаграма без чисел\nЦіна на екрані\n«ШІ» тричі поспіль\nПартнер виходить на сцену\nХтось називає невідомий продукт\n«Магічно»\nСлайд про час роботи від батареї\nФункція для тренувань\n«Конфіденційність вбудовано»\nОплески розробників\n«Погляньмо»\nДемонстрація наживо на телефоні\nПоліпшена камера\n«Вийде пізніше цього року»\nВедучий змінює вбрання\nЗнімання території з дрона\n«Тонший і легший»\nСлайд з одним словом\nГендиректор каже «неймовірно»\nХтось дякує команді\nКаламбур у назві функції\nТрансляція зависає\n"
      stream:
        name: 'Бінго з прямим ефіром'
        squares: "«Ви мене чуєте?»\nЕфір починається із запізненням\nЗ’являється домашній улюбленець\nУ чаті спамлять тим самим емодзі\nХтось отримує великий донат\n«Ставте вподобайки й підписуйтеся»\nМікрофон вимкнено\nЗникає інтернет\nГра вилітає\nСтример лютує\nВирішальний хід\nУ чаті підказують, як грати\nРейд\nСтример забуває перемкнути сцену\nЗачитування реклами спонсора\nДзвінок у двері\nПерерва на перекуску\n«Чате, це реально?»\nХтось питає «яке у вас обладнання?»\nДосягнуто нової цілі за кількістю підписників\nВипадково показано вкладку\nОпитування в чаті\n«Ще одна гра»\nСтример співає\nДраматична музична вставка\nДрукарська помилка в назві ефіру\nПриєднується гість\n«Зараз повернуся»\nРаптове зависання\nМодератори тимчасово вимикають комусь чат\n"
      super_bowl:
        name: 'Бінго з рекламою Супербоулу'
        squares: "Пес затьмарює всіх\nЗнаменитість грає саму себе\nПродовження старої реклами\nТварина говорить\nНемовля або малюк\nХтось плаче\nРеклама трейлера фільму\nРоботи або ШІ\nКінь клайдсдейльської породи\nАвто робить щось неможливе\nНостальгійна пісня 80-х або 90-х\nЕпізодична поява колишнього спортсмена\nДві знаменитості разом\nДо кінця незрозуміло, що рекламують\nQR-код на екрані\nРеклама пива\nРеклама чипсів або снеків\nРеклама спантеличує\nКовбой\nРеклама, знята одним кадром\nХтось падає\nФлешмоб або танець\nКосмос або прибульці\nКруті бабуся й дідусь\nХибна кінцівка\nФраза «день матчу»\nМузикант виступає в рекламі\nРеклама незнайомого застосунку\nХтось ламає четверту стіну\nКумедне уповільнення кадру\n"
